name: Veliora bot

on:
  schedule:
    - cron: "2,32 * * * *"   # har 30 daqiqada (UTC). Bot Toshkent vaqtini o'zi hisoblaydi.
  workflow_dispatch:          # Actions sahifasidan qo'lda ishga tushirish

permissions:
  contents: write

concurrency:
  group: veliora-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Botni ishga tushirish
        run: python3 bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Holatni saqlash
        if: always()
        run: |
          git config user.name "veliora-bot"
          git config user.email "veliora-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "bot: holat yangilandi"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || true
            git push
          fi
